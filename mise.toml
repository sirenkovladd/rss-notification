[tasks.build]
sources = ['src/**/*', 'index.ts'] # skip running if these files haven't changed
outputs = ['index.js.gz']
run = "bun build --target=bun index.ts | gzip -9 > index.js.gz"

[tasks.build-ts]
run = "bun build --target=bun --minify index.ts"

[tasks.run]
alias = 'r'
run = "bun -r ./plugin.ts index.ts"

[tasks.watch]
alias = 'w'
run = "watchexec -e ts -r bun -r ./plugin.ts index.ts"

[tasks.push]
depends = ["build"]
run = "rclone copyto ./index.js.gz ec21:./code/rss-check.js.gz"

[tasks.update-config]
alias = "uc"
run = "rclone copyto ./config.json ec21:./code/config.json"

[env]
_.file = ".env"